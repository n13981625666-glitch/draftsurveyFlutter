name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ships:
        description: '要构建的船舶 ID，逗号分隔；all = ships-lib/ 里的全部'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ships: ${{ steps.list.outputs.ships }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: list
        env:
          WANT: ${{ inputs.ships || 'all' }}
        run: |
          set -e
          SHIPS="$(node tools/list-ships.mjs "$WANT")"
          echo "Ships to build: $SHIPS"
          if [ "$SHIPS" = "[]" ]; then
            echo "::error::ships-lib/ 里没有任何 .shipx 文件"
            exit 1
          fi
          echo "ships=$SHIPS" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: node tools/select-ship.mjs "$(ls ships-lib | head -1 | sed 's/.shipx//')"
      - run: flutter create --project-name draft_survey --platforms=android .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: [plan, test]
    strategy:
      fail-fast: false
      matrix:
        ship: ${{ fromJSON(needs.plan.outputs.ships) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - shell: bash
        run: |
          node tools/select-ship.mjs "${{ matrix.ship }}"
          node tools/bootstrap_platforms.mjs --platforms=windows
          flutter pub get
          flutter build windows --release --dart-define=DS_LICENSE_URL=${{ vars.DS_LICENSE_URL }}
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "DraftSurvey-${{ matrix.ship }}-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.ship }}
          path: DraftSurvey-${{ matrix.ship }}-windows.zip

  android:
    needs: [plan, test]
    strategy:
      fail-fast: false
      matrix:
        ship: ${{ fromJSON(needs.plan.outputs.ships) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          node tools/select-ship.mjs "${{ matrix.ship }}"
          node tools/bootstrap_platforms.mjs --platforms=android
          flutter pub get
          flutter build apk --release --dart-define=DS_LICENSE_URL=${{ vars.DS_LICENSE_URL }}
          cp build/app/outputs/flutter-apk/app-release.apk "DraftSurvey-${{ matrix.ship }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.ship }}
          path: DraftSurvey-${{ matrix.ship }}.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
