name: draft_survey
description: Draft Survey - draft survey calculator (Flutter port of the Tauri app).
publish_to: none
version: 5.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  http: ^1.2.2
  cryptography: ^2.7.0
  file_selector: ^1.0.3
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ships/
    - assets/keys/
    - assets/branding/splash-icon.png
    - assets/branding/wechat_qr.jpg
